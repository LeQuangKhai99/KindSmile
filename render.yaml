services:
  - type: web
    name: kindsmile-dental
    env: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:iE2gNi2KnmK9nQSDa04hM5Flxyrg+hgYtjBE/uTKGTE=
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: APP_URL
        value: https://kindsmile.onrender.com
